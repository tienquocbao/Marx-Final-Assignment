<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123c2b">
  <meta name="description" content="Vùng Cồn Xanh — Không gian chung của infographic tương tác, web game giáo dục và video minh họa MLN122 Group 2.">
  <title>Vùng Cồn Xanh | Infographic · Web game · Video</title>
  <link rel="icon" type="image/svg+xml" href="assets/site-logo.svg">
  <link rel="stylesheet" href="styles/portal.css">
  <script src="scripts/portal.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand" aria-label="Vùng Cồn Xanh — Group 2 MLN122">
        <div class="brand-emblem" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none"><path d="M23.6 42V15" stroke="#e5efb6" stroke-width="2.8" stroke-linecap="round"/><path d="M23 31C12 30 8 21 8 14c11 0 15 7 15 17Z" fill="#c1e39c"/><path d="M25 25C36 24 39 16 39 9c-11 .5-15 7-14 16Z" fill="#8dcd86"/><path d="M23.5 20c-5-2-8-7-8-14 6 1 10 7 8 14Z" fill="#f0d88b"/><path d="M14 41c7-2 14-2 21 0" stroke="#c1e39c" stroke-width="2.4" stroke-linecap="round"/></svg>
        </div>
        <div class="brand-copy"><strong>VÙNG CỒN XANH</strong><span>GROUP 2 <b aria-hidden="true">·</b> MLN122</span></div>
      </div>

      <nav class="tablist" role="tablist" aria-label="Ba sản phẩm của nhóm">
        <button class="tab is-selected" role="tab" type="button" id="tab-infographic" aria-controls="view-infographic" aria-selected="true" tabindex="0" data-tab="infographic">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16v18H4zM7 7h5M7 10h10M7 14h4v4H7zM14 14h3M14 18h3"/></svg>
          <span>Infographic</span>
        </button>
        <button class="tab" role="tab" type="button" id="tab-game" aria-controls="view-game" aria-selected="false" tabindex="-1" data-tab="game">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 8h11a4.1 4.1 0 0 1 4 3.1l1.1 6c.6 3.2-2.6 5.1-5 3.1L15 18H9l-2.6 2.2c-2.4 2-5.6.1-5-3.1l1.1-6A4.1 4.1 0 0 1 6.5 8ZM6 13h5M8.5 10.5v5M16 12h.1M19 14h.1"/></svg>
          <span>Web game</span>
        </button>
        <button class="tab" role="tab" type="button" id="tab-video" aria-controls="view-video" aria-selected="false" tabindex="-1" data-tab="video">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m10 8 6 4-6 4z"/></svg>
          <span>Video</span>
        </button>
        <span class="tab-indicator" aria-hidden="true"></span>
      </nav>

      <div class="header-actions">
        <span class="section-counter" id="sectionCounter" aria-live="polite">01 / 03</span>
        <button id="openSeparate" class="icon-action" type="button" title="Mở nội dung hiện tại trong tab riêng" aria-label="Mở nội dung hiện tại trong tab riêng">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5h6v6M19 5l-9 9M19 13v6H5V5h6"/></svg>
        </button>
        <button id="fullScreenButton" class="icon-action" type="button" title="Toàn màn hình" aria-label="Chuyển toàn màn hình">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg>
        </button>
      </div>
    </header>

    <main id="contentStage" class="content-stage">
      <div class="stage-frame" aria-hidden="true"></div>

      <section class="experience experience--iframe is-active" id="view-infographic" role="tabpanel" aria-labelledby="tab-infographic" aria-hidden="false">
        <div class="loading-state" id="loading-infographic" aria-live="polite">
          <span class="loading-mark" aria-hidden="true">✦</span>
          <strong>Đang mở infographic…</strong><span>Nội dung nguyên bản của nhóm</span>
        </div>
        <iframe id="iframe-infographic" title="Infographic tương tác Vùng Cồn Xanh" data-src="experiences/infographic/index.html" src="experiences/infographic/index.html" allow="fullscreen; autoplay" loading="eager"></iframe>
      </section>

      <section class="experience experience--iframe" id="view-game" role="tabpanel" aria-labelledby="tab-game" aria-hidden="true" inert>
        <div class="loading-state" id="loading-game" aria-live="polite">
          <span class="loading-mark" aria-hidden="true">✦</span>
          <strong>Đang mở web game…</strong><span>Giữ nguyên cốt truyện và cách chơi</span>
        </div>
        <iframe id="iframe-game" title="Web game Vùng Cồn Xanh" data-src="experiences/game/index.html" allow="fullscreen; autoplay" loading="lazy"></iframe>
      </section>

      <section class="experience experience--video" id="view-video" role="tabpanel" aria-labelledby="tab-video" aria-hidden="true" inert>
        <div class="video-ambient" aria-hidden="true"></div>
        <div class="video-layout">
          <div class="video-heading">
            <div class="video-kicker"><span class="video-kicker-dot" aria-hidden="true"></span> VIDEO MINH HỌA <span class="video-duration">06:10</span></div>
            <h1>Nhà nước &amp; Nông nghiệp CNC</h1>
            <p>Video của nhóm — phát trực tiếp tại đây.</p>
          </div>
          <div class="video-player-shell">
            <video id="featureVideo" class="feature-video" controls playsinline preload="metadata" poster="assets/video/poster.jpg">
              <source src="assets/video/nha-nuoc-nong-nghiep-cnc.mp4" type="video/mp4">
              Trình duyệt của bạn chưa hỗ trợ video MP4.
            </video>
          </div>
          <div class="video-footer">
            <div class="video-footer-left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10M7 8l5 5 5-5M4 17v3h16v-3"/></svg><span>Video gốc, không chỉnh sửa nội dung</span></div>
            <a href="assets/video/nha-nuoc-nong-nghiep-cnc.mp4" target="_blank" rel="noopener noreferrer" class="video-standalone-link">Mở video riêng <span aria-hidden="true">↗</span></a>
          </div>
        </div>
      </section>
    </main>

    <div class="screenreader" id="tabAnnouncement" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>
</body>
</html>
